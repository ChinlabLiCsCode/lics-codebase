# make sure you update CONFIG_PATH in mloop_multishot.py and
# plot_mloop_results.py before running the optimization
# so that it uses the corrent config file

[COMPILATION]
mock = false

[ANALYSIS]
cost_key = ["live_image_analysis", "rho_2d (atoms/um^2)"]
maximize = true
ignore_bad = false # true
analysislib_console_log_level = 20
analysislib_file_log_level = 10
groups = ["Cs_MOT_params"]

[MLOOP]
num_training_runs = 50
max_num_runs_without_better_params = 100
max_num_runs = 500
trust_region = 0.2
cost_has_noise = true
no_delay = true
visualisations = false
controller_type = "gaussian_process"
console_log_level = 0




# 2D MOT
[MLOOP_PARAMS.Cs_MOT_params.Cs_2DMOT_X_minus_CsMOT]
global_name = 'Cs_2DMOT_X_minus_CsMOT'
min = 0
max = 2.9
start = 1.5

[MLOOP_PARAMS.Cs_MOT_params.Cs_2DMOT_X_plus_CsMOT]
global_name = 'Cs_2DMOT_X_plus_CsMOT'
min = 0
max = 2.9
start = 1.5

[MLOOP_PARAMS.Cs_MOT_params.Cs_2DMOT_Y_minus_CsMOT]
global_name = 'Cs_2DMOT_Y_minus_CsMOT'
min = 0
max = 2.9
start = 1.5

[MLOOP_PARAMS.Cs_MOT_params.Cs_2DMOT_Y_plus_CsMOT]
global_name = 'Cs_2DMOT_Y_plus_CsMOT'
min = 0
max = 2.9
start = 1.5

