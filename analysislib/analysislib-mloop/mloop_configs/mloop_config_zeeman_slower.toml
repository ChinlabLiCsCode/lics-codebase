# make sure you update CONFIG_PATH in mloop_multishot.py and
# plot_mloop_results.py before running the optimization
# so that it uses the corrent config file

# Zeeman slower coils C2, C3, C4 and the MOT detuning, maximizing MOT atom
# number.  C1 is held at 0 and C5 at its set value; start values below are the
# 2026-08-20 globals.

[COMPILATION]
mock = false

[ANALYSIS]
cost_key = ["absorption_image_analysis", "N_int"]
maximize = true
ignore_bad = false # true
analysislib_console_log_level = 20
analysislib_file_log_level = 10
groups = ["Cs_MOT_params"]

[MLOOP]
num_training_runs = 25
max_num_runs_without_better_params = 30
max_num_runs = 100
trust_region = 0.5
cost_has_noise = true
no_delay = false
visualisations = false
controller_type = "gaussian_process"
console_log_level = 0

# Automatically creates the mapping to a runmanager global
[MLOOP_PARAMS.Cs_MOT_params.Zeeman_C2_CsMOT]
global_name = 'Zeeman_C2_CsMOT' # << Specify the runmanager global it maps to
min = 0
max = 0.5
start = 0.417

[MLOOP_PARAMS.Cs_MOT_params.Zeeman_C3_CsMOT]
global_name = 'Zeeman_C3_CsMOT'
min = 0
max = 0.5
start = 0.139

[MLOOP_PARAMS.Cs_MOT_params.Zeeman_C4_CsMOT]
global_name = 'Zeeman_C4_CsMOT'
min = 0
max = 0.5
start = 0.043

# MOT detuning.  Range spans the CMOT (-6.8) and imaging (-7.665) settings
# either side of the MOT value.
[MLOOP_PARAMS.Cs_MOT_params.Cs_MOT_Freq_CsMOT]
global_name = 'Cs_MOT_Freq_CsMOT'
min = -8.0
max = -6.5
start = -7.236
