# make sure you update CONFIG_PATH in mloop_multishot.py and
# plot_mloop_results.py before running the optimization
# so that it uses the corrent config file

[COMPILATION]
mock = false

[ANALYSIS]
cost_key = ["absorption_image_analysis", "rho_2d (atoms/um^2)"]
maximize = true
ignore_bad = false # true
analysislib_console_log_level = 20
analysislib_file_log_level = 10
groups = ["Cs_Molasses_params"]

[MLOOP]
num_training_runs = 50
max_num_runs_without_better_params = 100
max_num_runs = 500
trust_region = 0.2
cost_has_noise = true
no_delay = false
visualisations = false
controller_type = "gaussian_process"
console_log_level = 0

# Bias X
[MLOOP_PARAMS.Cs_Molasses_params.Bias_X_HH_Molasses]
global_name = 'Bias_X_HH_Molasses'
min = -1.5
max = 3
start = 1.5

[MLOOP_PARAMS.Cs_Molasses_params.Bias_X_AH_Molasses]
global_name = 'Bias_X_AH_Molasses'
min = -3
max = 3
start = 0


# Bias Y
[MLOOP_PARAMS.Cs_Molasses_params.Bias_Y_HH_Molasses]
global_name = 'Bias_Y_HH_Molasses'
min = -2
max = 4
start = -1

[MLOOP_PARAMS.Cs_Molasses_params.Bias_Y_AH_Molasses]
global_name = 'Bias_Y_AH_Molasses'
min = -3
max = 3
start = 0


# Bias Z
[MLOOP_PARAMS.Cs_Molasses_params.Bias_Z_HH_Molasses]
global_name = 'Bias_Z_HH_Molasses'
min = -6
max = 0
start = -3

[MLOOP_PARAMS.Cs_Molasses_params.Bias_Z_AH_Molasses]
global_name = 'Bias_Z_AH_Molasses'
min = -3
max = 3
start = 0

# 3D MOT AOM amplitude
[MLOOP_PARAMS.Cs_Molasses_params.Cs_3DMOT_AO_AM_Molasses]
global_name = 'Cs_3DMOT_AO_AM_Molasses'
min = -1.5
max = 3
start = 1.5


# 3D MOT Freq
[MLOOP_PARAMS.Cs_Molasses_params.Cs_MOT_Freq_Molasses]
global_name = 'Cs_MOT_Freq_Molasses'
min = -6
max = -5
start = -5.9


# Repump Freq
[MLOOP_PARAMS.Cs_Molasses_params.Cs_Rep_Freq_Molasses]
global_name = 'Cs_Rep_Freq_Molasses'
min = 6
max = 7
start = 6.45


# Molasses time
[MLOOP_PARAMS.Cs_Molasses_params.Cs_Molasses_Time]
global_name = 'Cs_Molasses_Time'
min = 0
max = 0.1
start = 0.05