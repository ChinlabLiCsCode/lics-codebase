# make sure you update CONFIG_PATH in mloop_multishot.py and
# plot_mloop_results.py before running the optimization
# so that it uses the corrent config file

[COMPILATION]
mock = false

[ANALYSIS]
cost_key = ["live_image_analysis", "rho_2d (atoms/um^2)"]
maximize = true
ignore_bad = false # true
analysislib_console_log_level = 20
analysislib_file_log_level = 10
groups = ["Cs_CMOT_params"]

[MLOOP]
num_training_runs = 50
max_num_runs_without_better_params = 100
max_num_runs = 500
trust_region = 0.2
cost_has_noise = true
no_delay = true
visualisations = true
controller_type = "gaussian_process"
console_log_level = 0

# Bitter coil
[MLOOP_PARAMS.Cs_CMOT_params.Bitter_V_AH_CsCMOT1]
global_name = 'Bitter_V_AH_CsCMOT1'
min = 0.02
max = 0.8
start = 0.5

[MLOOP_PARAMS.Cs_CMOT_params.Bitter_V_AH_CsCMOT2]
global_name = 'Bitter_V_AH_CsCMOT2'
min = 0.02
max = 0.9
start = 0.75

# Bias X
