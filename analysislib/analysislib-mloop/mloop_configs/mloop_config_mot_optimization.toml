# make sure you update CONFIG_PATH in mloop_multishot.py and
# plot_mloop_results.py before running the optimization
# so that it uses the corrent config file

[COMPILATION]
mock = false

[ANALYSIS]
cost_key = ["live_image_analysis", "rho_2d (atoms/um^2)"]
maximize = true
ignore_bad = false # true
analysislib_console_log_level = 20
analysislib_file_log_level = 10
groups = ["Cs_CsMOT_params"]

[MLOOP]
num_training_runs = 50
max_num_runs_without_better_params = 100
max_num_runs = 500
trust_region = 0.2
cost_has_noise = true
no_delay = true
visualisations = false
controller_type = "gaussian_process"
console_log_level = 0



#Bitter coils
[MLOOP_PARAMS.Cs_CsMOT_params.Bitter_V_AH_CsMOT]
global_name = 'Bitter_V_AH_CsMOT'
min = 0.14
max = 0.3
start = 0.18



# Bias X
[MLOOP_PARAMS.Cs_CsMOT_params.Bias_X_HH_CsMOT]
global_name = 'Bias_X_HH_CsMOT'
min = -8
max = 8
start = 1.5

[MLOOP_PARAMS.Cs_CsMOT_params.Bias_X_AH_CsMOT]
global_name = 'Bias_X_AH_CsMOT'
min = -5
max = 5
start = 0


# Bias Y
[MLOOP_PARAMS.Cs_CsMOT_params.Bias_Y_HH_CsMOT]
global_name = 'Bias_Y_HH_CsMOT'
min = -8
max = 8
start = -3

[MLOOP_PARAMS.Cs_CsMOT_params.Bias_Y_AH_CsMOT]
global_name = 'Bias_Y_AH_CsMOT'
min = -5
max = 5
start = 0


# Bias Z
[MLOOP_PARAMS.Cs_CsMOT_params.Bias_Z_HH_CsMOT]
global_name = 'Bias_Z_HH_CsMOT'
min = -8
max = 5
start = -3

[MLOOP_PARAMS.Cs_CsMOT_params.Bias_Z_AH_CsMOT]
global_name = 'Bias_Z_AH_CsMOT'
min = -5
max = 5
start = 0

# 3D MOT AOM amplitude
[MLOOP_PARAMS.Cs_CsMOT_params.Cs_3DMOT_AO_AM_CsMOT]
global_name = 'Cs_3DMOT_AO_AM_CsMOT'
min = 0
max = 4
start = 2.3


# 3D MOT Freq
[MLOOP_PARAMS.Cs_CsMOT_params.Cs_MOT_Freq_CsMOT]
global_name = 'Cs_MOT_Freq_CsMOT'
min = -8
max = -7
start = -7.31


# Repump Freq
[MLOOP_PARAMS.Cs_CsMOT_params.Cs_Rep_Freq_CsMOT]
global_name = 'Cs_Rep_Freq_CsMOT'
min = 6
max = 7
start = 6.51